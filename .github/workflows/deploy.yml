name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  # ─── 1. Push schema & functions ke Convex self-hosted ──────
  deploy-convex:
    name: Push Convex Schema & Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Convex schema & functions
        env:
          CONVEX_ADMIN_KEY: ${{ secrets.CONVEX_ADMIN_KEY }}
        run: |
          npx convex deploy \
            --url https://api-rcsamata.rahmanef.com \
            --admin-key "$CONVEX_ADMIN_KEY"

  # ─── 2. Trigger redeploy Next.js di Dokploy ────────────────
  deploy-nextjs:
    name: Redeploy Next.js on Dokploy
    runs-on: ubuntu-latest
    needs: deploy-convex
    steps:
      - name: Trigger Dokploy application deploy
        run: |
          curl --fail -s -X POST \
            "https://backend.rahmanef.com/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"applicationId":"5dtXzRVLui5qszBFfz7h7"}'
          echo "Dokploy redeploy triggered for rc-samata-dash"
